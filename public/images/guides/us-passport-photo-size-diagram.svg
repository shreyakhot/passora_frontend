<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">US passport photo size diagram</title>
  <desc id="d">A 2 by 2 inch (51 by 51 mm) photo frame. The head, measured from the bottom of the chin to the top of the hair, must be between 1 and 1 3/8 inches (25 to 35 mm). The background is plain white or off-white.</desc>
  <rect width="860" height="720" fill="#FFFFFF"/>
  <!-- Photo frame: 600 px = 51 mm, so 1 mm = 11.76 px -->
  <rect x="60" y="40" width="600" height="600" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
  <!-- Shoulders -->
  <path d="M120 640 C140 545 225 515 300 505 L420 505 C495 515 580 545 600 640 Z" fill="#CBD5E1"/>
  <!-- Neck -->
  <rect x="318" y="430" width="84" height="90" rx="20" fill="#E2C9B0"/>
  <!-- Head: top of hair y=130, chin y=483 (30 mm) -->
  <ellipse cx="360" cy="306" rx="128" ry="177" fill="#E8D2BC" stroke="#94A3B8" stroke-width="2"/>
  <path d="M232 290 C228 170 300 128 360 129 C420 128 492 170 488 290 C470 215 420 190 360 190 C300 190 250 215 232 290 Z" fill="#475569"/>
  <!-- Eyes and mouth -->
  <ellipse cx="312" cy="300" rx="14" ry="8" fill="#334155"/>
  <ellipse cx="408" cy="300" rx="14" ry="8" fill="#334155"/>
  <line x1="330" y1="400" x2="390" y2="400" stroke="#9A5B4A" stroke-width="5" stroke-linecap="round"/>
  <!-- Guide lines at top of hair and chin -->
  <line x1="60" y1="129" x2="690" y2="129" stroke="#4D7C0F" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="60" y1="483" x2="690" y2="483" stroke="#4D7C0F" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Head height bracket -->
  <line x1="700" y1="129" x2="700" y2="483" stroke="#4D7C0F" stroke-width="3"/>
  <line x1="690" y1="129" x2="710" y2="129" stroke="#4D7C0F" stroke-width="3"/>
  <line x1="690" y1="483" x2="710" y2="483" stroke="#4D7C0F" stroke-width="3"/>
  <text x="720" y="285" font-size="22" font-weight="700" fill="#0F172A">Head height</text>
  <text x="720" y="315" font-size="20" fill="#0F172A">25–35 mm</text>
  <text x="720" y="342" font-size="20" fill="#0F172A">(1–1 3/8 in)</text>
  <text x="720" y="372" font-size="16" fill="#475569">chin to top</text>
  <text x="720" y="393" font-size="16" fill="#475569">of hair</text>
  <!-- Width dimension -->
  <line x1="60" y1="670" x2="660" y2="670" stroke="#0F172A" stroke-width="2"/>
  <line x1="60" y1="660" x2="60" y2="680" stroke="#0F172A" stroke-width="2"/>
  <line x1="660" y1="660" x2="660" y2="680" stroke="#0F172A" stroke-width="2"/>
  <text x="360" y="705" font-size="20" font-weight="700" text-anchor="middle" fill="#0F172A">2 in (51 mm)</text>
  <!-- Height dimension -->
  <line x1="30" y1="40" x2="30" y2="640" stroke="#0F172A" stroke-width="2"/>
  <line x1="20" y1="40" x2="40" y2="40" stroke="#0F172A" stroke-width="2"/>
  <line x1="20" y1="640" x2="40" y2="640" stroke="#0F172A" stroke-width="2"/>
  <text x="22" y="340" font-size="20" font-weight="700" text-anchor="middle" fill="#0F172A" transform="rotate(-90 22 340)">2 in (51 mm)</text>
  <!-- Background label -->
  <text x="80" y="75" font-size="17" fill="#475569">Plain white or off-white background, no shadows</text>
</svg>
